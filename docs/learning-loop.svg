<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1120" viewBox="0 0 660 1120" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5D6D7E"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#C0392B"/>
    </marker>
  </defs>

  <rect width="660" height="1120" fill="#FFFFFF"/>

  <text x="330" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#17202A">The learning loop</text>
  <text x="330" y="56" text-anchor="middle" font-size="13" fill="#5D6D7E">Reading is not enough — knowledge sticks only when you retrieve it.</text>

  <!-- 1 Warm up -->
  <rect x="120" y="80" width="420" height="64" rx="12" fill="#FDEBD0" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Warm up</text>
  <text x="330" y="126" text-anchor="middle" font-size="12.5" fill="#34495E">Try to answer the question yourself — even a wrong attempt counts.</text>

  <!-- 2 Short explanation -->
  <rect x="120" y="184" width="420" height="64" rx="12" fill="#D6EAF8" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Short explanation</text>
  <text x="330" y="230" text-anchor="middle" font-size="12.5" fill="#34495E">Core idea + one vivid example, in simple unambiguous language (STE).</text>

  <!-- 3 Active recall -->
  <rect x="120" y="288" width="420" height="64" rx="12" fill="#D5F5E3" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Active recall</text>
  <text x="330" y="334" text-anchor="middle" font-size="12.5" fill="#34495E">Answer 3–5 questions in your own words, without looking back.</text>

  <!-- 4 Review -->
  <rect x="120" y="392" width="420" height="64" rx="12" fill="#E8DAEF" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="418" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Review</text>
  <text x="330" y="438" text-anchor="middle" font-size="12.5" fill="#34495E">What is right, what is wrong, what is missing.</text>

  <!-- 5 Close the gaps -->
  <rect x="120" y="496" width="420" height="64" rx="12" fill="#FADBD8" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="522" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Close the gaps</text>
  <text x="330" y="542" text-anchor="middle" font-size="12.5" fill="#34495E">Re-answer only what you missed.</text>

  <!-- 6 Knowledge card -->
  <rect x="120" y="600" width="420" height="64" rx="12" fill="#D1F2EB" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="626" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Knowledge card</text>
  <text x="330" y="646" text-anchor="middle" font-size="12.5" fill="#34495E">+ apply it within 24 hours.</text>

  <!-- 7 Reminder 2-3 days -->
  <rect x="120" y="704" width="420" height="64" rx="12" fill="#EAECEE" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="740" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Reminder: 2–3 days</text>

  <!-- 8 Reminder 7 days -->
  <rect x="120" y="808" width="420" height="64" rx="12" fill="#EAECEE" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="844" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Reminder: 7 days</text>

  <!-- 9 Reminder ~3 weeks -->
  <rect x="120" y="912" width="420" height="64" rx="12" fill="#EAECEE" stroke="#5D6D7E" stroke-width="1.5"/>
  <text x="330" y="948" text-anchor="middle" font-size="15" font-weight="bold" fill="#17202A">Reminder: ~3 weeks</text>

  <!-- 10 It's yours -->
  <rect x="120" y="1016" width="420" height="64" rx="12" fill="#ABEBC6" stroke="#1E8449" stroke-width="1.8"/>
  <text x="330" y="1054" text-anchor="middle" font-size="16" font-weight="bold" fill="#145A32">It's yours</text>

  <!-- main flow arrows -->
  <line x1="330" y1="144" x2="330" y2="180" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="248" x2="330" y2="284" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="352" x2="330" y2="388" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="456" x2="330" y2="492" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="560" x2="330" y2="596" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="664" x2="330" y2="700" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="768" x2="330" y2="804" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="872" x2="330" y2="908" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="976" x2="330" y2="1012" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- confident labels -->
  <text x="348" y="790" font-size="12" fill="#1E8449">confident</text>
  <text x="348" y="894" font-size="12" fill="#1E8449">confident</text>
  <text x="348" y="998" font-size="12" fill="#1E8449">confident</text>

  <!-- shaky return spine -->
  <path d="M 120,736 L 56,736 M 120,840 L 56,840 M 120,944 L 56,944 M 56,944 L 56,528 L 118,528" fill="none" stroke="#C0392B" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text transform="translate(16,736) rotate(-90)" text-anchor="middle" font-size="12" fill="#C0392B">if shaky — back to close the gaps</text>

  <text x="330" y="1100" text-anchor="middle" font-size="12" fill="#7F8C8D">The interval grows while your answers stay confident; shaky answers loop back until the gaps close.</text>
</svg>
